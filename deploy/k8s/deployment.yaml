
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbanpulse-coordinator-deployment
  labels:
    app.kubernetes.io/name: urbanpulse-coordinator
    app.kubernetes.io/part-of: urbanpulse-fleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: urbanpulse-coordinator
  template:
    metadata:
      labels:
        app: urbanpulse-coordinator
    spec:
      containers:
        - name: coordinator
          image: urbanpulse/coordinator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
              name: rpc
            - containerPort: 9100
              name: mom-broker
            - containerPort: 9030
              name: control-tcp
            - containerPort: 9200
              name: dfs-namenode
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: namenode-storage
              mountPath: /app/data/namenode
      volumes:
        - name: namenode-storage
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbanpulse-driver-daemonset
  labels:
    app.kubernetes.io/name: urbanpulse-drivers
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urbanpulse-driver
  template:
    metadata:
      labels:
        app: urbanpulse-driver
    spec:
      containers:
        - name: driver-node
          image: urbanpulse/driver:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 9021
              name: p2p-udp
              protocol: UDP
            - containerPort: 9031
              name: control-tcp
            - containerPort: 9041
              name: beacon-udp
              protocol: UDP
            - containerPort: 9301
              name: dfs-datanode
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbanpulse-gateway-deployment
  labels:
    app.kubernetes.io/name: urbanpulse-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urbanpulse-gateway
  template:
    metadata:
      labels:
        app: urbanpulse-gateway
    spec:
      containers:
        - name: express-gateway
          image: urbanpulse/gateway:latest
          ports:
            - containerPort: 5000
              name: http-ws
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
