
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urbanpulse-probed-fleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: urbanpulse-probed
  template:
    metadata:
      labels:
        app: urbanpulse-probed
    spec:
      containers:
        - name: gateway-container
          image: urbanpulse/gateway:latest
          ports:
            - containerPort: 5000

          # 1. Startup Probe: Allows initial socket cluster startup without premature killing
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 10
            periodSeconds: 2

          # 2. Liveness Probe: Mirrors HeartbeatMonitor (3.5s timeout)
          # Restarts container if heartbeat loops freeze
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2

          # 3. Readiness Probe: Checks whether node is ready to accept RPC & Ride traffic
          readinessProbe:
            httpGet:
              path: /api/cluster/status
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 2
            successThreshold: 1
            failureThreshold: 2
